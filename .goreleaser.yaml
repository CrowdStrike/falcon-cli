release:
  # The release workflow runs on a release published in the UI, and GoReleaser
  # overwrites the existing title with this template. RELEASE_NAME carries the
  # UI title through; local runs, which leave it unset, fall back to the tag.
  # Release notes are kept as written (the default release.mode).
  name_template: '{{ envOrDefault "RELEASE_NAME" .Tag }}'

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
