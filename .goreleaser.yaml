
version: 2

project_name: falcon-cli

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    binary: falcon
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X github.com/crowdstrike/falcon-cli/internal/version.Version={{.Version}} -X github.com/crowdstrike/falcon-cli/internal/version.GitCommit={{.Commit}}'
    main: ./cmd/falcon/main.go
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - s390x
      - ppc64le
    ignore:
      - goos: windows
        goarch: 386
      - goos: windows
        goarch: s390x
      - goos: darwin
        goarch: s390x

archives:
  - id: archives
    formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macos-
      {{- else }}{{- .Os }}-{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

  - id: binary
    formats:
      - binary
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macos-
      {{- else }}{{- .Os }}-{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

nfpms:
  - package_name: falcon-cli
    # Per-format conventions: falcon-cli_1.2.3_amd64.deb, falcon-cli-1.2.3-1.x86_64.rpm
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: CrowdStrike Inc.
    homepage: https://crowdstrike.com/
    maintainer: CrowdStrike <cloud-integrations@crowdstrike.com>
    description: |-
      The CrowdStrike Falcon CLI allows you to work effortlessly with the CrowdStrike Falcon platform.
    license: MIT
    release: "1"
    formats:
      - deb
      - rpm
    rpm:
      summary: The CrowdStrike Falcon CLI tool

# Package manager publishers, disabled until their target repos exist:
# CrowdStrike/homebrew-tap, CrowdStrike/scoop-bucket, and a fork of
# microsoft/winget-pkgs (owned by a bot account that can open the upstream PR).
# Each pins ids to the tar.gz/zip archives so the raw "binary" archives are not
# offered as a second artifact per platform. PACKAGE_REPOS_TOKEN needs write
# access to those repos; the workflow GITHUB_TOKEN is scoped to this repo only.
